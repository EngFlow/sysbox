name: Build Sysbox Packages

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Test Sysbox
    runs-on: ubuntu-26.04
    steps:
      - name: Show versions
        run: |
          echo "Docker"
          docker --version
          echo "uname"
          uname -a

      - name: Checkout repository and submodules
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Test Sysbox
        run: |
          (cd sysbox-mgr && git apply ../sysbox-mgr-dont-call-errorf.patch)
          (cd sysbox-mgr && git apply ../sysbox-mgr.patch)
          (cd sysbox-runc && git apply ../sysbox-runc.patch)
          sudo apt update && sudo apt install -y apparmor-utils
          sudo aa-complain fusermount3 # makes sense only in isolated environment, do not copy to bundles
          make test

  build:
    name: Build Sysbox (DEB)
    runs-on: ubuntu-26.04
    steps:
      - name: Show versions
        run: |
          echo "Docker"
          docker --version
          echo "uname"
          uname -a

      - name: Checkout repository and submodules
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build Sysbox
        run: |
          (cd sysbox-pkgr && git apply ../sysbox-pkgr.patch)
          (cd sysbox-pkgr && git apply ../changelog-converter.patch)
          (cd sysbox-pkgr && git apply ../trick-to-workarount-always-fail-setup.patch)
          (cd sysbox-pkgr && make sysbox-deb ubuntu-resolute)

      - name: Locate generated .deb packages
        run: |
          find . -type f -name "*.deb" -ls

      - name: Upload DEB artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sysbox-deb-packages
          path: "**/*.deb"
          if-no-files-found: error